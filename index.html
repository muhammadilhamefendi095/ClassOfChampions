<!DOCTYPE html>
<html lang="id">

<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:17px;

button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:.6em 1em;font-weight:800;color:var(--ink);background:var(--y);box-shadow:0 4px 0 rgba(0,0,0,.35)}

.ghost{background:rgba(255,255,255,.12);color:var(--tx)}
.cyan{background:var(--cy)}.green{background:var(--g)}.red{background:var(--r);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
header.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
header.top h1{font-size:clamp(1.4rem,3.6vw,2.1rem)}

.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chipu{padding:.35em .8em;border-radius:99px;background:var(--bg3);border:2px solid var(--tc,var(--line));font-weight:800;font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.tab{background:var(--bg2);color:var(--tx);box-shadow:none;border:2px solid var(--line)}
.tab.on{background:var(--cy);color:var(--ink);border-color:var(--cy)}

.panel h2{font-size:1.4rem;margin-bottom:8px}
.meta{color:var(--mut);font-size:.9rem}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* =============== BANK SOAL (edit di sini) ===============
 t = jenis penilaian jawaban:
   num   = hasil hitung, nilai sama (6/5, 12/10, 1,2 diterima)
   frac  = pecahan biasa, nilai sama (boleh tidak disederhanakan)
   exact = pecahan harus persis sama dengan kunci ("tanpa menyederhanakan")
   simp  = pecahan harus bentuk paling sederhana (persis kunci)
   dec   = bilangan desimal
   pct   = persen (tanda % boleh dihilangkan)                       */
const L1=[
['Hasil dari 4 × {1/2} = ……','2','num'],
['Hasil dari 3 × {2/5} adalah ....','6/5','num'],
['Ubahlah 0,3 menjadi pecahan biasa!','3/10','frac'],
['Ubahlah 0,7 menjadi pecahan biasa!','7/10','frac'],

['Ubahlah {3/10} menjadi bentuk persen!','30%','pct'],
['Ubahlah 45% menjadi pecahan biasa!','45/100','frac'],
['Ubahlah 25% menjadi bilangan desimal!','0,25','dec'],
['Ubahlah 0,8 menjadi bentuk persen!','80%','pct'],
['Ubahlah {4/5} menjadi bilangan desimal!','0,8','dec']];
const L2=[
['Hitunglah 12 × {3/4}','36/4','num'],
['Ubahlah 1,25 menjadi pecahan biasa!','125/100','frac'],
['Ubahlah {13/20} menjadi bilangan desimal!','0,65','dec'],
['Ubahlah 0,375 menjadi pecahan biasa!','375/1000','frac'],
['Ubahlah {7/20} menjadi bentuk persen!','35%','pct'],
['Ubahlah 65% menjadi pecahan biasa!','65/100','frac'],
['Ubahlah 125% menjadi bilangan desimal!','1,25','dec'],
['Ubahlah 1,35 menjadi bentuk persen!','135%','pct'],
['Hitunglah 15 × {2/3} !','30/3','num'],
['Ubahlah 0,625 menjadi bentuk persen!','62,5%','pct']];
const L3=[
['Sebuah toko memiliki 48 kg beras. Sebanyak {5/8} bagian dari beras tersebut terjual. Berapa kilogram beras yang terjual?','30','num'],
['Ubahlah 2,375 menjadi pecahan biasa tanpa menyederhanakannya!','2375/1000','exact'],
['Ubahlah {37/40} menjadi bilangan desimal!','0,925','dec'],
['Dalam sebuah kelas, {17/25} bagian murid mengikuti kegiatan olahraga. Berapa persen murid yang mengikuti kegiatan tersebut?','68%','pct'],
['Sebuah tangki terisi air sebanyak 135% dari kapasitas satuan yang dijadikan acuan. Ubahlah 135% menjadi pecahan biasa tanpa menyederhanakannya!','135/100','exact'],
['Ibu mempunyai 36 meter pita. Sebanyak {7/12} bagian digunakan untuk menghias kelas. Berapa meter pita yang digunakan?','21','num'],
['Sebuah barang mengalami kenaikan harga sebesar 237,5% dari harga acuannya. Ubahlah 237,5% menjadi bilangan desimal!','2,375','dec'],
['Panjang sebuah pita adalah 2,375 meter. Nyatakan angka 2,375 dalam bentuk persen!','237,5%','pct'],
['Ubahlah 135% menjadi pecahan biasa tanpa menyederhanakannya!','135/100','exact'],
['Dari 200 buku di perpustakaan, sebanyak {17/25} bagian merupakan buku cerita. Berapa persen buku cerita tersebut dari seluruh buku?','68%','pct']];
const PTS={1:10,2:20,3:30};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const B1=(()=>{const all=[];[[1,L1],[2,L2],[3,L3]].forEach(([l,L])=>L.forEach((x,i)=>all.push({id:l+'-'+(i+1),l,q:x[0],a:x[1],t:x[2]})));
 const r=rng(2026);for(let i=all.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[all[i],all[j]]=[all[j],all[i]]}return all})();

const B2=[
{q:'Ibu Guru membawa 12 kotak kue sus ke kelas untuk dibagikan saat jam istirahat. Ternyata, para siswa hanya menghabiskan {3/4} bagian dari seluruh kue yang dibawa. Berapa kotak kue sus yang berhasil dihabiskan oleh para siswa?',a:'9',t:'num',e:'12 × {3/4} = 9'},
{q:'Di kantin sekolah, Pak Janu membuat satu teko besar Es Teh. Sebanyak 60% dari isi teko tersebut sudah dibeli oleh siswa kelas 6. Nyatakan bagian es teh yang terjual itu ke dalam bentuk pecahan biasa yang paling sederhana!',a:'3/5',t:'simp',e:'60% = 60/100, disederhanakan dengan dibagi 20 menjadi {3/5}'},
{q:'Siti menggunakan pensil warna hitam untuk menggaris tepi gambarnya. Setelah selesai menggambar, pensil warnanya berkurang panjangnya sebanyak {7/10} cm. Tuliskan pengurangan panjang pensil tersebut dalam bentuk bilangan desimal!',a:'0,7',t:'dec',e:'{7/10} diubah langsung ke bentuk desimal menjadi 0,7'},
{q:'Saat membuka aplikasi belajar di rumah, sisa baterai HP milik Edo menunjukkan angka 0,45 bagian. Berapa persen sisa baterai HP Edo tersebut?',a:'45%',t:'pct',e:'0,45 = 45/100 = 45%'},
{q:'Budi mendapat tugas PR Matematika. Sebelum mandi sore, Budi sudah menyelesaikan {4/5} bagian dari seluruh PR tersebut. Berapa persen PR yang sudah selesai dikerjakan Budi?',a:'80%',t:'pct',e:'{4/5}, penyebut dan pembilang dikali 20 menjadi 80/100 = 80%'}];
const B2PTS=20, B3PTS=10;

const B3=[
['M-07','Hitunglah 6 × {2/3} !','4','num'],['P-03','Ubahlah 0,45 menjadi pecahan biasa tanpa menyederhanakannya!','45/100','exact'],
['D-09','Ubahlah {7/20} menjadi bilangan desimal!','0,35','dec'],['S-02','Ubahlah {3/5} menjadi bentuk persen!','60%','pct'],
['M-11','Hitunglah 18 × {5/6} !','15','num'],['P-08','Ubahlah 1,375 menjadi pecahan biasa tanpa menyederhanakannya!','1375/1000','exact'],
['D-04','Ubahlah {17/25} menjadi bilangan desimal!','0,68','dec'],['S-10','Ubahlah 85% menjadi pecahan biasa tanpa menyederhanakannya!','85/100','exact'],
['M-02','Ibu memiliki 42 meter pita. Sebanyak {5/7} bagian digunakan untuk menghias kelas. Berapa meter pita yang digunakan?','30','num'],
['P-12','Ubahlah 2,625 menjadi pecahan biasa tanpa menyederhanakannya!','2625/1000','exact'],
['D-06','Ubahlah {9/16} menjadi bilangan desimal!','0,5625','dec'],['S-05','Ubahlah 37,5% menjadi bilangan desimal!','0,375','dec'],
['M-09','Sebuah toko memiliki 56 kg beras. Sebanyak {3/8} bagian terjual. Berapa kilogram beras yang terjual?','21','num'],
['P-01','Ubahlah 0,875 menjadi pecahan biasa tanpa menyederhanakannya!','875/1000','exact'],
['D-12','Ubahlah {13/40} menjadi bentuk persen!','32,5%','pct'],['S-08','Ubahlah 237,5% menjadi bilangan desimal!','2,375','dec'],
['M-04','Hitunglah 32 × {7/8} !','28','num'],['P-10','Ubahlah 3,125 menjadi pecahan biasa tanpa menyederhanakannya!','3125/1000','exact'],
['D-01','Ubahlah {23/50} menjadi bentuk persen!','46%','pct'],['S-06','Ubahlah 1,625 menjadi bentuk persen!','162,5%','pct']
].map(x=>({code:x[0],q:x[1],a:x[2],t:x[3]}));

/* =============== PENILAI JAWABAN =============== */
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g,'').replace(/[a-z²³]+\.?$/,'')}
function numOf(s){s=norm(s).replace('%','');let m;
 if(m=s.match(/^(\d+)\/(\d+)$/)){return +m[2]?{v:m[1]/m[2],n:+m[1],d:+m[2],f:1}:null}
 if(/^(\d+([.,]\d*)?|[.,]\d+)$/.test(s))return{v:parseFloat(s.replace(',','.')),f:0};return null}
function grade(t,key,inp){
 const a=norm(inp);if(!a)return false;const hasPct=a.includes('%');
 if(t==='exact'||t==='simp')return a===norm(key);
 const A=numOf(a),K=numOf(key);if(!A||!K)return false;
 const eq=Math.abs(A.v-K.v)<1e-9;
 if(t==='num')return !hasPct&&eq;
 if(t==='frac'){if(hasPct)return false;if(A.f)return A.n*(K.f?K.d:1)===(K.f?K.n:K.v)*A.d;return !K.f&&eq&&Number.isInteger(A.v)}
 if(t==='dec')return !hasPct&&!A.f&&eq;
 if(t==='pct')return !A.f&&eq;
 return false}
const fx=s=>String(s).replace(/\{(\d+)\/(\d+)\}/g,'<span class="fr"><i>$1</i><i>$2</i></span>');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const keyHtml=a=>/^\d+\/\d+$/.test(a)&&0?fx(a):esc(a);

/* =============== STATE =============== */
const TC=['#ffd84d','#4fc3ff','#4be39a','#ff8fb1','#ffa64d','#c9a7ff'];
const NAMES=['Elang','Harimau','Naga','Rajawali','Banteng','Komodo'];
const KEY='sdq_v2';
function defS(){return{pin:'1234',snd:1,incB1:1,nT:4,tn:[...NAMES],
 students:['Amira','Fani','Arya','Azbi','Fadel','Indrika','Agus','Bilal','Fathir','Farid','Niswa','Aqila','Aafiyah','Amelia','Daffa','Saheer','Aminah','Ummu'].map((n,i)=>({id:'s'+(i+1),name:n,team:i%4})),
 open:{1:1,2:0,3:0},b1:{claims:{},att:{}},b2:{cur:null,ring:null,tried:[],done:{}},
 b3:{fin:null,turn:0,relay:null,done:{},pts:{},ended:0}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||defS();

try{sess=JSON.parse(sessionStorage.getItem('sdq_s'));ui.tab=sessionStorage.getItem('sdq_t')}catch(e){}

const $=s=>document.querySelector(s);
const tcol=t=>TC[t%6], tname=t=>S.tn[t]||('Tim '+(t+1));
const stu=id=>S.students.find(s=>s.id===id);

const tB1=t=>S.students.filter(s=>s.team===t).reduce((a,s)=>a+sB1(s.id),0);
const tB2=t=>Object.values(S.b2.done).filter(d=>d.team===t).reduce((a,d)=>a+d.p,0);
const tTot=t=>tB2(t)+(S.incB1?tB1(t):0);
const tB3=t=>S.b3.pts[t]||0;
const teamIds=()=>Array.from({length:S.nT},(_,i)=>i);
const rankTeams=()=>teamIds().sort((a,b)=>tTot(b)-tTot(a));

/* =============== SUARA =============== */
let ac;
function tone(f,t0,d,type='triangle',v=.3){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sndOk=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.28));
const sndNo=()=>{tone(220,0,.3,'sawtooth',.22);tone(165,.25,.5,'sawtooth',.22)};
const sndBell=()=>{tone(1040,0,.5);tone(780,.12,.5)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2400)}

/* =============== KEYPAD JAWABAN =============== */
let KP=null;
function openKeypad(ctx){KP={ctx,val:'',stage:'in',res:null};drawKP();const d=$('#kp');if(d.open)d.close();d.showModal()}
function drawKP(){
 const d=$('#kp'),c=KP.ctx;
 if(KP.stage==='in'){
  const keys=['7','8','9','⌫','4','5','6','%','1','2','3','/'];
  d.innerHTML=`<div class="kp"><div class="kph"><span>MASUKKAN JAWABAN</span><button class="x" data-a="kpx" aria-label="Tutup">✕</button></div>
  <div class="kpm">${c.sub}</div>${c.q?`<div class="kpq">${c.q}</div>`:''}
  <div class="disp" id="disp">${esc(KP.val)||'&nbsp;'}</div>
  <div class="pad">${keys.map(k=>`<button data-a="kpk" data-k="${k}">${k}</button>`).join('')}
  <button data-a="kpk" data-k=",">,</button><button data-a="kpk" data-k="0">0</button><button class="span2" data-a="kprst">Reset</button></div>
  <div class="kpa"><button class="cyan" data-a="kpsub" id="kpsub">Submit</button></div></div>`;
 }else{
  const r=KP.res;
  d.innerHTML=`<div class="kp"><div class="res ${r.ok?'ok':'no'}"><div class="ic">${r.ok?'✅':'❌'}</div><div class="big">${r.ok?'BENAR!':'SALAH'}</div>
  <p style="font-size:1.1rem;margin:6px 0">${r.msg}</p><p class="meta">Jawabanmu: <b>${esc(KP.val)}</b></p>
  ${r.extra||''}
  <div class="row" style="justify-content:center;margin-top:10px">${!r.ok&&r.retry?'<button class="cyan" data-a="kpretry">Coba lagi</button>':''}<button data-a="kpx" class="${r.ok?'green':'ghost'}">${r.ok?'Lanjut':'Tutup'}</button></div></div></div>`;
 }}
function kpInput(k){if(!KP||KP.stage!=='in')return;
 if(k==='⌫')KP.val=KP.val.slice(0,-1);else if(KP.val.length<14)KP.val+=k;
 const e=$('#disp');if(e)e.innerHTML=esc(KP.val)||'&nbsp;'}
function kpSubmit(){if(!KP||KP.stage!=='in')return;if(!KP.val.trim()){toast('Isi jawaban dulu');return}
 const c=KP.ctx,ok=grade(c.t,c.key,KP.val);const r=c.commit(ok,KP.val);r.ok=ok;
 KP.res=r;KP.stage='out';save();ok?sndOk():sndNo();drawKP()}
addEventListener('keydown',e=>{
 if(KP&&$('#kp').open&&KP.stage==='in'){
  if(/^[0-9]$/.test(e.key)||e.key==='/'||e.key==='%'||e.key===','){kpInput(e.key);e.preventDefault()}
  else if(e.key==='.'){kpInput(',');e.preventDefault()}
  else if(e.key==='Backspace'){kpInput('⌫');e.preventDefault()}
  else if(e.key==='Enter'){kpSubmit();e.preventDefault()}}});
function showDlg(h){const d=$('#dlg');d.innerHTML=`<div class="gdlg">${h}</div>`;if(d.open)d.close();d.showModal()}
$('#kp').addEventListener('close',()=>{KP=null;render()});
$('#dlg').addEventListener('close',render);

const A={
 kpx(){$('#kp').close()},
 kpk(d){kpInput(d.k)},
 kprst(){if(KP){KP.val='';drawKP()}},
 kpsub(){kpSubmit()},
 kpretry(){KP.stage='in';KP.val='';drawKP()},
 dx(){$('#dlg').close()},
 tab(d){setTab(d.t);render()},
 logout(){setSess(null);render()},
 mute(){S.snd=S.snd?0:1;save();render()},
 glogin(){if($('#pin').value===S.pin){setSess({role:'guru'});setTab('home');render()}else toast('PIN salah')},
 mlogin(d){setSess({role:'murid',sid:d.sid});setTab('b1');render()},
 /* ---- guru: pengaturan umum ---- */
 open(d){S.open[d.b]=S.open[d.b]?0:1;save();render()},
 shuffleTeams(){const ids=S.students.map(s=>s.id).sort(()=>Math.random()-.5);ids.forEach((id,i)=>stu(id).team=i%S.nT);save();render()},
 nT(){const n=+$('#nT').value;S.nT=n;S.students.forEach(s=>{if(s.team>=n)s.team=s.team%n});S.b3.fin=null;save();render()},
 saveNames(){S.students.forEach(s=>{const e=$('#nm_'+s.id);if(e)s.name=e.value.trim()||s.name;const t=$('#tm_'+s.id);if(t)s.team=+t.value});
  for(let i=0;i<S.nT;i++){const e=$('#tn_'+i);if(e)S.tn[i]=e.value.trim()||NAMES[i]}save();toast('Tersimpan');render()},
 importNames(){const L=$('#paste').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return;
  L.forEach((n,i)=>{if(S.students[i])S.students[i].name=n});
  for(let i=S.students.length;i<L.length;i++)S.students.push({id:'s'+(i+1),name:L[i],team:i%S.nT});save();toast(L.length+' nama dimuat');render()},
 setPin(){const p=$('#npin').value.trim();if(p.length<3)return toast('PIN minimal 3 karakter');S.pin=p;save();toast('PIN diganti')},
 incB1(){S.incB1=$('#inc').checked?1:0;save();render()},
 resetB(d){if(!confirm('Reset data '+d.b+'?'))return;
  if(d.b==='b1')S.b1={claims:{},att:{}};if(d.b==='b2')S.b2={cur:null,ring:null,tried:[],done:{}};if(d.b==='b3')S.b3={fin:null,turn:0,relay:null,done:{},pts:{},ended:0};
  if(d.b==='all'){const p=S.pin;S=defS();S.pin=p}save();render()},
 /* ---- Tantangan 1 ---- */
 b1q(d){const q=B1[+d.i],cl=S.b1.claims[q.id];
  if(sess.role==='guru'){showDlg(`<h2>No ${+d.i+1} · ${'★'.repeat(q.l)}</h2><div class="qbig">${fx(q.q)}</div><div class="keybox"><b>Kunci:</b> ${fx(esc(q.a))}</div>
   ${cl?`<p>Dijawab benar oleh <b>${esc(stu(cl.sid)?.name||'?')}</b> (+${cl.p})</p><button class="red" data-a="b1reopen" data-i="${d.i}">Buka ulang kartu</button> `:''}<button class="ghost" data-a="dx">Tutup</button>`);return}
  if(!S.open[1])return toast('Tantangan 1 belum dibuka guru');
  if(cl)return toast('Soal ini sudah dijawab benar');
  const me=stu(sess.sid);
  openKeypad({sub:`Tantangan 1 · Soal No ${+d.i+1} · ${'★'.repeat(q.l)} (+${PTS[q.l]} poin)`,q:fx(q.q),t:q.t,key:q.a,
   commit(ok){const k=q.id;S.b1.att[me.id+'|'+k]=(S.b1.att[me.id+'|'+k]||0)+1;
    if(ok){if(S.b1.claims[k])return{msg:'Soal ini sudah diambil temanmu lebih dulu.',retry:false};S.b1.claims[k]={sid:me.id,p:PTS[q.l]};return{msg:`Hebat! Kamu mendapat <b>+${PTS[q.l]} poin</b>.`}}
    return{msg:'Belum tepat, tidak ada pengurangan poin. Periksa lagi bentuk jawabannya.',retry:true}}})},
 b1reopen(d){delete S.b1.claims[B1[+d.i].id];save();$('#dlg').close()},
 /* ---- Tantangan 2 ---- */
 b2start(d){if(S.b2.cur!=null&&!S.b2.done[S.b2.cur])return toast('Selesaikan soal yang sedang berjalan');
  S.b2.cur=+d.i;S.b2.ring=null;S.b2.tried=[];save();render()},
 b2bell(d){const b=S.b2,t=+d.t;if(b.cur==null||b.done[b.cur]||b.ring!=null||b.tried.includes(t))return;b.ring=t;save();sndBell();render()},
 b2release(){S.b2.ring=null;save();render()},
 b2close(){const b=S.b2;b.done[b.cur]={team:null,p:0};b.ring=null;save();render()},
 b2next(){S.b2.cur=null;S.b2.ring=null;S.b2.tried=[];save();render()},
 b2ans(){const b=S.b2,i=b.cur,q=B2[i],t=b.ring;if(t==null)return;
  openKeypad({sub:`Tantangan 2 · Soal ${i+1} · <b style="color:${tcol(t)}">Tim ${esc(tname(t))}</b> (+${B2PTS} poin)`,q:fx(q.q),t:q.t,key:q.a,
   commit(ok){if(S.b2.done[i])return{msg:'Soal ini sudah selesai.'};
    if(ok){S.b2.done[i]={team:t,p:B2PTS};S.b2.ring=null;return{msg:`<b>Tim ${esc(tname(t))}</b> merebut <b>+${B2PTS} poin</b>!`,extra:`<div class="keybox"><b>Pembahasan:</b> ${fx(q.e)}</div>`}}
    S.b2.tried.push(t);S.b2.ring=null;
    if(S.b2.tried.length>=S.nT){S.b2.done[i]={team:null,p:0};return{msg:'Semua tim sudah mencoba. Kita bahas bersama.',extra:`<div class="keybox"><b>Kunci:</b> ${fx(q.e)}</div>`}}
    return{msg:`Tim ${esc(tname(t))} belum tepat. Tanpa pengurangan poin, kesempatan untuk tim lain!`}}})},
 /* ---- Tantangan 3 ---- */
 setFin(){const r=rankTeams();if(r.length<2)return;if(Object.keys(S.b3.done).length&&!confirm('Tantangan 3 sudah berjalan. Ganti finalis dan reset Tantangan 3?'))return;
  S.b3={fin:[r[0],r[1]],turn:0,relay:null,done:{},pts:{},ended:0};save();render()},
 setFinManual(){const a=+$('#f1').value,b=+$('#f2').value;if(a===b)return toast('Pilih dua tim berbeda');S.b3={fin:[a,b],turn:0,relay:null,done:{},pts:{},ended:0};save();render()},
 b3turn(){S.b3.turn=1-S.b3.turn;save();render()},
 b3end(){S.b3.ended=1;save();render();sndOk()},
 b3q(d){const b=S.b3,i=+d.i,q=B3[i];
  if(!b.fin)return;if(b.done[i])return toast('Kartu sudah dipakai');if(b.ended)return toast('Pertandingan sudah selesai');
  if(sess.role==='murid'&&!S.open[3])return toast('Tantangan 3 belum dibuka guru');
  const active=b.relay?b.relay.team:b.fin[b.turn];
  if(b.relay&&b.relay.i!==i)return toast('Selesaikan dulu kartu '+B3[b.relay.i].code);
  if(sess.role==='murid'&&stu(sess.sid).team!==active)return toast('Sekarang giliran Tim '+tname(active));
  openKeypad({sub:`Grand Final · Kode <b>${q.code}</b> · <b style="color:${tcol(active)}">Tim ${esc(tname(active))}</b> (+${B3PTS})`,q:`Lihat soal <b>${q.code}</b> pada lembar soal fisik, lalu ketik jawabannya.`,t:q.t,key:q.a,
   commit(ok){const bb=S.b3;if(bb.done[i])return{msg:'Kartu sudah selesai.'};
    const starter=bb.relay?bb.relay.starter:active,other=bb.fin[0]===active?bb.fin[1]:bb.fin[0];
    const finish=()=>{bb.turn=1-bb.fin.indexOf(starter);bb.relay=null;if(Object.keys(bb.done).length>=B3.length)bb.ended=1};
    if(ok){bb.done[i]={team:active,p:B3PTS};bb.pts[active]=(bb.pts[active]||0)+B3PTS;finish();return{msg:`<b>Tim ${esc(tname(active))}</b> mendapat <b>+${B3PTS} poin</b>!`}}
    if(!bb.relay){bb.relay={i,team:other,starter};return{msg:`Belum tepat, tanpa pengurangan poin. Kesempatan untuk <b>Tim ${esc(tname(other))}</b>.`}}
    bb.done[i]={team:null,p:0};finish();return{msg:'Kedua tim belum tepat. Kartu ditutup.',extra:`<div class="keybox"><b>Kunci:</b> ${esc(q.a)}</div>`}}})}
};

function vB3(me){
 const b=S.b3,guru=!me;
 let h=`<div class="panel"><h2>Tantangan 3 · Grand Final Champion</h2><p class="meta">Dua tim dengan nilai tertinggi bersaing. Soal ada di lembar fisik; di layar hanya tersedia kode soal. Pilih kode, baca soalnya di lembar, lalu ketik jawabannya. Benar +${B3PTS} poin. Jika salah, lawan mendapat kesempatan.</p>
 ${me&&!S.open[3]?'<div class="notice">Tantangan 3 belum dibuka guru.</div>':''}`;
 if(!b.fin){
  h+=`<div class="notice">Finalis belum ditetapkan oleh guru.</div>`;
  if(guru)h+=`<div class="row"><button class="cyan" data-a="setFin">Tetapkan 2 tim teratas</button><span class="meta">atau pilih manual:</span>
  <select id="f1">${teamIds().map(t=>`<option value="${t}">${esc(tname(t))}</option>`).join('')}</select> vs <select id="f2">${teamIds().map(t=>`<option value="${t}" ${t===1?'selected':''}>${esc(tname(t))}</option>`).join('')}</select><button class="ghost" data-a="setFinManual">Tetapkan</button></div>`;
  return h+'</div>'}
 const act=b.relay?b.relay.team:b.fin[b.turn];
 h+=`<div class="teams" style="grid-template-columns:repeat(2,1fr)">${b.fin.map(t=>`<div class="team" style="--tc:${tcol(t)};${t===act&&!b.ended?'box-shadow:0 0 22px '+tcol(t):''}"><h3>${esc(tname(t))}${t===act&&!b.ended?' · GILIRAN':''}</h3><div class="s">${tB3(t)}</div></div>`).join('')}</div>`;
 if(b.ended){const [x,y]=b.fin,px=tB3(x),py=tB3(y);
  h+=`<div class="champ" style="margin-top:12px">${px===py?'<div class="f">SERI!</div><p>Skor sama. Tentukan juara dengan soal tambahan.</p>':`<div style="font-size:3rem">🏆</div><div class="f">JUARA: ${esc(tname(px>py?x:y))}</div><p>${Math.max(px,py)} poin vs ${Math.min(px,py)} poin</p>`}</div>`}
 else if(b.relay)h+=`<div class="banner">Kartu <b>${B3[b.relay.i].code}</b> terbuka untuk <b style="color:${tcol(b.relay.team)}">Tim ${esc(tname(b.relay.team))}</b> (kesempatan kedua).</div>`;
 else h+=`<div class="banner">Giliran memilih kartu: <b style="color:${tcol(act)}">Tim ${esc(tname(act))}</b></div>`;
 h+=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${B3.map((q,i)=>{const d=b.done[i],lock=b.relay&&b.relay.i!==i;
  return `<button class="card code ${d?'done':''} ${lock?'lock':''}" data-a="b3q" data-i="${i}" style="${d&&d.team!=null?'border-color:'+tcol(d.team):''}"><span class="no">${q.code}</span>${d?`<span class="who2" style="text-align:center">${d.team!=null?esc(tname(d.team)):'✘'}</span>`:''}</button>`}).join('')}</div>
 <p class="meta">Kartu terpakai: ${Object.keys(b.done).length} / ${B3.length}</p>`;
 if(guru)h+=`<div class="row"><button class="ghost" data-a="b3turn">Ganti giliran</button><button class="cyan" data-a="b3end">Umumkan juara</button><button class="red" data-a="resetB" data-b="b3">Reset Tantangan 3</button></div>`;
 return h+'</div>'}

function vSkor(me){return `<div class="panel"><h2>Skor tim</h2>${teamTable()}</div>
 <div class="panel"><h2>Peringkat individu</h2>${indTable(18)}</div>
 <div class="panel"><h2>Anggota timmu · ${esc(tname(me.team))}</h2><p>${S.students.filter(s=>s.team===me.team).map(s=>`<span class="chipu" style="--tc:${tcol(me.team)}">${esc(s.name)}</span>`).join(' ')}</p></div>`}

function vKunci(){
 const k=a=>fx(esc(a));
 return `<div class="panel"><h2>Tantangan 1 · Kunci (urutan nomor di papan)</h2><table><tr><th>No</th><th>Lv</th><th>Soal</th><th>Kunci</th></tr>${B1.map((q,i)=>`<tr><td>${i+1}</td><td>${'★'.repeat(q.l)}</td><td>${fx(q.q)}</td><td><b>${k(q.a)}</b></td></tr>`).join('')}</table></div>
 <div class="panel"><h2>Tantangan 2 · Kunci & pembahasan</h2><table>${B2.map((q,i)=>`<tr><td>${i+1}</td><td>${fx(q.q)}</td><td><b>${k(q.a)}</b><br><span class="meta">${fx(q.e)}</span></td></tr>`).join('')}</table></div>
 <div class="panel"><h2>Tantangan 3 · Kode soal (cocokkan dengan lembar fisik)</h2><table><tr><th>Kode</th><th>Soal</th><th>Kunci</th></tr>${B3.map(q=>`<tr><td><b>${q.code}</b></td><td>${fx(q.q)}</td><td><b>${esc(q.a)}</b></td></tr>`).join('')}</table></div>`}

function vSet(){
 return `<div class="panel"><h2>Pengaturan</h2>
 <p class="row"><input id="npin" placeholder="PIN baru"><button class="cyan" data-a="setPin">Ganti PIN guru</button></p>
 <p><label><input type="checkbox" id="inc" ${S.incB1?'checked':''} onchange="A.incB1()"> Skor Tantangan 1 anggota ikut dihitung ke total tim (untuk menentukan finalis)</label></p>
 <div class="row"><button class="red" data-a="resetB" data-b="b1">Reset Tantangan 1</button><button class="red" data-a="resetB" data-b="b2">Reset Tantangan 2</button><button class="red" data-a="resetB" data-b="b3">Reset Tantangan 3</button><button class="red" data-a="resetB" data-b="all">Reset SEMUA</button></div>
 <p class="meta">Data tersimpan di peramban perangkat ini (localStorage). Beberapa tab pada peramban yang sama saling tersinkron.</p></div>`}

render();
</script>
     <script src="champions-ui.js"></script>
